<svg xmlns="http://www.w3.org/2000/svg" width="200" height="86" viewBox="0 0 200 86" role="img">
<title>slow-query-viewer: An analysis tool that visualizes query statistics, time-series data, and parameters simply by dragging and dropping a MySQL slow query log into your browser. It requires no server setup and is ready to use immediately.</title>
